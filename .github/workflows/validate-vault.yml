name: vault

# Enforcement that does not depend on one editor being used. The Claude
# Code hooks only see Edit/Write/MultiEdit; this runs on every push and
# pull request regardless of how the change was authored.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The validator is stdlib-only, and ubuntu-latest ships python3
      # preinstalled - no setup-python, no dependency installation step.
      - name: Validator self-test
        run: bash .claude/skills/mechatronics-docs/tests/run.sh

      # Deliberately not redundant with the self-test: run.sh reaches the
      # template vault through a relative path and would skip it if the
      # layout ever moved. This step names the path and fails loudly.
      - name: Template vault audit
        run: python3 .claude/skills/mechatronics-docs/validate_vault.py 00_documentation/01_projectvault

      # The method's own decision record is a vault and is audited as one.
      # Named by path for the same reason as the step above: a relative
      # discovery would silently skip if the layout moved. Its length WARNs
      # are the measured cost of 31 real decisions and do not fail the job.
      - name: Method decision vault audit
        run: python3 .claude/skills/mechatronics-docs/validate_vault.py .claude/01_methodvault

      # An export is evidence only if it is reproducible. Running it twice and
      # diffing is the property itself, not a proxy for it: unsorted iteration
      # is what made Sphinx-Needs' needs.json undiffable until they fixed it.
      - name: Traceability export is deterministic
        run: |
          # The same output directory twice, with the first run copied aside.
          # Two different directories would differ in the provenance block's
          # command line, which is a true record and not a determinism defect.
          python3 .claude/skills/mechatronics-docs/export_traceability.py \
            00_documentation/01_projectvault --output-dir "$RUNNER_TEMP/tr" \
            --no-timestamp
          cp -r "$RUNNER_TEMP/tr" "$RUNNER_TEMP/tr-ref"
          python3 .claude/skills/mechatronics-docs/export_traceability.py \
            00_documentation/01_projectvault --output-dir "$RUNNER_TEMP/tr" \
            --no-timestamp
          diff -r "$RUNNER_TEMP/tr-ref" "$RUNNER_TEMP/tr"

      # The README stores the export's own output. Generated content is
      # committed in exactly two places here, each with a mechanism that
      # proves it current: these blocks (DEC-MTH-037) and the quoted output
      # of TUTORIAL.md, replayed by the self-test above (DEC-MTH-040).
      # That is only defensible while something proves it current, so the
      # export runs again here and every block between a marker pair is
      # diffed against it. The vault is the source; a change to the worked
      # example that never reached the README fails this step. Only the
      # machine-independent lines are compared - the index's provenance head
      # carries an absolute path and a digest and would differ on every
      # runner, while the graph carries none of the three and is stored whole.
      #
      # Three blocks since DEC-MTH-043, so the check is a loop rather than
      # three copies of itself. The list it loops over is verified against
      # the file first: a block nobody diffs is stored generated content
      # with no gate on it, which is the one failure this widening could
      # introduce, and a copy-paste slip in the list below is exactly how
      # it would happen.
      - name: README generated blocks are current
        run: |
          python3 .claude/skills/mechatronics-docs/export_traceability.py \
            00_documentation/01_projectvault --output-dir "$RUNNER_TEMP/readme-tr" \
            --no-timestamp > "$RUNNER_TEMP/export.out"

          CHECKED="traceability-graph traceability-counts traceability-excerpt"
          cp "$RUNNER_TEMP/readme-tr/traceability_graph.mmd" \
            "$RUNNER_TEMP/expected-traceability-graph.txt"
          grep -E '^(requirements|objects):' "$RUNNER_TEMP/export.out" \
            > "$RUNNER_TEMP/expected-traceability-counts.txt"
          sed -n '/^## Objects/,$p' "$RUNNER_TEMP/readme-tr/traceability_index.md" \
            > "$RUNNER_TEMP/expected-traceability-excerpt.txt"

          present=$(grep -oE '^<!-- traceability-[a-z-]+:start -->$' README.md \
                    | sed -E 's/^<!-- (.+):start -->$/\1/' | sort -u | tr '\n' ' ')
          want=$(printf '%s\n' $CHECKED | sort -u | tr '\n' ' ')
          if [ "$present" != "$want" ]; then
            echo "README.md carries generated blocks this step does not check." >&2
            echo "  in the file: $present" >&2
            echo "  checked:     $want" >&2
            exit 1
          fi

          for marker in $CHECKED; do
            # Exactly one pair, matched as a whole line: prose may name a
            # marker without turning the rest of the README into a block.
            pair=$(awk -v m="$marker" \
                     '$0 == "<!-- " m ":start -->" {s++}
                      $0 == "<!-- " m ":end -->" {e++}
                      END {print s+0, e+0}' README.md)
            if [ "$pair" != "1 1" ]; then
              echo "README.md must carry exactly one $marker marker pair, found $pair" >&2
              exit 1
            fi
            # The fence lines are found by matching, never by position, so a
            # blank line or a <details> wrapper around them does not shift
            # what gets compared.
            awk -v m="$marker" \
                '$0 == "<!-- " m ":start -->" {b=1;next}
                 $0 == "<!-- " m ":end -->" {b=0}
                 b && /^```/{f=!f;next}
                 b && f' README.md > "$RUNNER_TEMP/actual-$marker.txt"
            if [ ! -s "$RUNNER_TEMP/actual-$marker.txt" ]; then
              echo "no fenced content between the $marker markers in README.md" >&2
              exit 1
            fi
            diff -u "$RUNNER_TEMP/expected-$marker.txt" \
                    "$RUNNER_TEMP/actual-$marker.txt" || {
              echo "The README's $marker block no longer matches the vault." >&2
              echo "CONTRIBUTING.md holds the recipe; the short form is:" >&2
              echo "  python3 .claude/skills/mechatronics-docs/export_traceability.py \\" >&2
              echo "    00_documentation/01_projectvault --output-dir /tmp/tr --no-timestamp" >&2
              echo "then paste /tmp/tr/traceability_graph.mmd, the two count lines of the" >&2
              echo "run, and everything from '## Objects' in traceability_index.md into" >&2
              echo "their own blocks." >&2
              exit 1
            }
          done

      # The worked example claims its evidence is the real output of a command.
      # Running that command here is what keeps the claim from decaying: both
      # the log and the evaluator are committed, so the check is reproducible
      # on any runner, and the negative control proves it can still fail.
      - name: Worked example evidence
        run: |
          python3 20_software/data_analysis/eval_battery_log.py \
            30_testdata/31_testdata_raw/2026-07-28_battery_monitoring/battery_log.csv
          if python3 20_software/data_analysis/eval_battery_log.py \
               30_testdata/32_testdata_processed/2026-07-28_battery_monitoring/battery_log_negative_control.csv; then
            echo "negative control passed - the acceptance checks are not falsifiable" >&2
            exit 1
          fi

      # The one step here that is stricter than a working session, and
      # deliberately so. Locally the validator raises the same question as
      # 'req-uncovered' and leaves it a WARN, because it cannot tell a
      # requirement nobody has verified yet from one whose vault never
      # adopted the 'verifies:' convention - blocking on that would stop a
      # session over an evidence chain that is merely still open
      # (DEC_Coverage_Is_Decided_On_The_Graph). That argument does not
      # reach here: CI sees the whole vault at once, this repository
      # authors the vault below and guarantees its conventions, and a red
      # check costs nobody a session.
      #
      # Reading a red run: the exporter names the class and the
      # requirements on stderr, and it writes the full export anyway -
      # open traceability.html from the run for the file and line. Green
      # locally and red here is therefore not a contradiction, it is this
      # step and only this step. Two classes are armed: a requirement no
      # allocation row names, and one no evidence note names in
      # 'verifies:'. A derived project inherits the option and not the
      # arming - see DERIVED_WORKFLOW in tools/new_project.py.
      - name: Template vault evidence chains are closed
        run: |
          python3 .claude/skills/mechatronics-docs/export_traceability.py \
            00_documentation/01_projectvault --output-dir "$RUNNER_TEMP/tr-armed" \
            --no-timestamp --fail-on not-allocated,no-evidence-note
